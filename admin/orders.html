<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคำสั่งซื้อ  | BNC Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=2.2">
  <link rel="stylesheet" href="../css/components.css?v=2.2">
  <link rel="stylesheet" href="../css/admin.css?v=2.2">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="sidebar-brand-title">
          <span></span>
          <span>BNC Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          
          <span>แดชบอร์ด</span>
        </a>
        <a href="orders.html" class="sidebar-link active">
          
          <span>คำสั่งซื้อ</span>
        </a>
        <a href="slips.html" class="sidebar-link">
          
          <span>ตรวจสอบสลิป</span>
        </a>
        <a href="groups.html" class="sidebar-link">
          
          <span>จัดการกลุ่ม LINE</span>
        </a>
        <a href="products.html" class="sidebar-link">
          
          <span>จัดการสินค้า</span>
        </a>
        <a href="fonts.html" class="sidebar-link">
          
          <span>จัดการฟอนต์</span>
        </a>
        <a href="portfolio.html" class="sidebar-link">
          <span>จัดการผลงาน</span>
        </a>
        <a href="points.html" class="sidebar-link">
          
          <span>ระบบคะแนน</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          
          <span>รีวิวลูกค้า</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          
          <span>ตั้งค่าร้าน</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-outline btn-sm btn-full"> ไปหน้าร้านค้า</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <h1 style="font-family: 'Prompt', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--text-main);">
            รายการคำสั่งซื้อทั้งหมด (Orders) 
          </h1>
        </div>
      </header>

      <div style="padding: 2rem 1.75rem;">
        <!-- Search & Filter -->
        <div style="display: flex; gap: 0.75rem; margin-bottom: 1.75rem; flex-wrap: wrap;">
          <input type="text" id="orderSearchBox" class="form-input" placeholder="ค้นหาเลข Order, ชื่อลูกค้า, LINE ID..." style="max-width: 320px;" oninput="renderOrdersTable()">
          <select id="orderTypeFilter" class="form-input" style="max-width: 160px;" onchange="renderOrdersTable()">
            <option value="ALL">ทุกประเภท</option>
            <option value="GROUP">LINE Group</option>
            <option value="FONT">ฟอนต์</option>
            <option value="PRODUCT">สินค้าดิจิทัล</option>
          </select>
          <select id="orderStatusFilter" class="form-input" style="max-width: 160px;" onchange="renderOrdersTable()">
            <option value="ALL">ทุกสถานะ</option>
            <option value="PAID">PAID (ชำระแล้ว)</option>
            <option value="VERIFYING">VERIFYING (รอตรวจสลิป)</option>
            <option value="REJECTED">REJECTED (ปฏิเสธ)</option>
          </select>
        </div>

        <!-- Orders Table -->
        <div class="card card--flat" style="overflow-x: auto; padding: 0.5rem; border: 1px solid var(--border-light); border-radius: var(--radius-lg); background: var(--bg-primary);">
          <table class="table" style="width: 100%; font-size: 0.9rem;">
            <thead>
              <tr style="border-bottom: 1px solid var(--border-light); text-align: left; background: var(--bg-secondary);">
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">เลขที่ Order</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">ลูกค้า</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">สินค้า/กลุ่ม</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">ประเภท</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">ยอดเงิน</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">LINE / Gmail</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">สถานะ</th>
                <th style="padding: 0.85rem; font-weight: 600; color: var(--text-main);">การกระทำ</th>
              </tr>
            </thead>
            <tbody id="ordersTbody">
              <!-- Render dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script>
    function renderOrdersTable() {
      const orders = Store.getOrders();
      const q = document.getElementById('orderSearchBox').value.trim().toLowerCase();
      const type = document.getElementById('orderTypeFilter').value;
      const status = document.getElementById('orderStatusFilter').value;

      let list = orders;
      if (q) {
        list = list.filter(o => 
          (o.order_number && o.order_number.toLowerCase().includes(q)) ||
          (o.customer_name && o.customer_name.toLowerCase().includes(q)) ||
          (o.line_id && o.line_id.toLowerCase().includes(q)) ||
          (o.gmail && o.gmail.toLowerCase().includes(q))
        );
      }
      if (type !== 'ALL') list = list.filter(o => o.order_type === type);
      if (status !== 'ALL') list = list.filter(o => o.status === status);

      const tbody = document.getElementById('ordersTbody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">ไม่พบรายการคำสั่งซื้อ</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(o => `
        <tr style="border-bottom: 1px solid var(--border-light);">
          <td style="padding: 0.85rem; font-weight: 600; color: var(--pink-deep);">#${o.order_number}</td>
          <td style="padding: 0.85rem; font-weight: 500; color: var(--text-main);">${o.customer_name}</td>
          <td style="padding: 0.85rem; color: var(--text-main);"><strong>${o.item_name}</strong></td>
          <td style="padding: 0.85rem;"><span class="badge" style="background: var(--bg-surface); color: var(--pink-deep); font-weight: 600;">${o.order_type}</span></td>
          <td style="padding: 0.85rem; font-family: 'Prompt', sans-serif; font-weight: 700; color: var(--pink-deep);">฿${o.amount}</td>
          <td style="padding: 0.85rem; font-size: 0.85rem; color: var(--text-muted);">
            ${o.line_id ? `LINE: <code style="color: var(--pink-deep);">${o.line_id}</code><br>` : ''}
            ${o.gmail ? `Gmail: <code>${o.gmail}</code>` : ''}
          </td>
          <td style="padding: 0.85rem;">
            <span class="badge" style="background: ${o.status === 'PAID' ? '#F0FDF4' : o.status === 'VERIFYING' ? '#FFFBEB' : '#FFF1F2'}; color: ${o.status === 'PAID' ? '#166534' : o.status === 'VERIFYING' ? '#92400E' : '#9F1239'}; font-weight: 600;">
              ${o.status === 'PAID' ? ' ชำระแล้ว' : o.status === 'VERIFYING' ? ' รอตรวจสลิป' : ' ปฏิเสธ'}
            </span>
          </td>
          <td style="padding: 0.85rem;">
            <a href="slips.html" class="btn btn-outline btn-sm">ดูสลิป </a>
          </td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderOrdersTable);
  </script>
</body>
</html>
