<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผลงาน & สไตล์งานออกแบบ | BNC Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=2.2">
  <link rel="stylesheet" href="../css/components.css?v=2.2">
  <link rel="stylesheet" href="../css/admin.css?v=2.2">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="sidebar-brand-title">
          <span>BNC Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <span>แดชบอร์ด</span>
        </a>
        <a href="orders.html" class="sidebar-link">
          <span>คำสั่งซื้อ</span>
        </a>
        <a href="slips.html" class="sidebar-link">
          <span>ตรวจสอบสลิป</span>
        </a>
        <a href="groups.html" class="sidebar-link">
          <span>จัดการกลุ่ม LINE</span>
        </a>
        <a href="products.html" class="sidebar-link">
          <span>จัดการสินค้า</span>
        </a>
        <a href="fonts.html" class="sidebar-link">
          <span>จัดการฟอนต์</span>
        </a>
        <a href="portfolio.html" class="sidebar-link active">
          <span>จัดการผลงาน</span>
        </a>
        <a href="points.html" class="sidebar-link">
          <span>ระบบคะแนน</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          <span>รีวิวลูกค้า</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          <span>ตั้งค่าร้าน</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-outline btn-sm btn-full">ไปหน้าร้านค้า</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <h1 style="font-family: 'Prompt', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--text-main);">
            จัดการแคตตาล็อกผลงาน & สไตล์
          </h1>
        </div>
        <div>
          <button type="button" class="btn btn-primary btn-sm" onclick="openAddModal()">+ เพิ่มผลงาน/สไตล์ใหม่</button>
        </div>
      </header>

      <div style="padding: 1.75rem;">
        <div class="card card--flat" style="padding: 1.5rem; border: 1px solid var(--border-light); border-radius: var(--radius-lg); background: #ffffff;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 style="font-family: 'Prompt', sans-serif; font-size: 1.1rem; color: var(--text-main); margin: 0;">รายการสไตล์งานทั้งหมด</h3>
            <span id="portfolioCount" class="badge badge--pink">0 สไตล์</span>
          </div>

          <div id="portfolioAdminList" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Render list items -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Add/Edit Portfolio Style -->
  <div class="modal-overlay" id="portModal">
    <div class="modal-box" style="max-width: 620px;">
      <button id="closePortModal" style="position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light);">×</button>
      
      <h3 id="portModalTitle" style="font-family: 'Prompt', sans-serif; font-size: 1.25rem; margin-bottom: 1.25rem; color: var(--text-main);">เพิ่มสไตล์ผลงานใหม่</h3>
      
      <form id="portForm">
        <input type="hidden" id="portEditId">
        <div class="form-group">
          <label class="form-label">ชื่อสไตล์ผลงาน</label>
          <input type="text" id="portTitle" class="form-input" placeholder="เช่น สไตล์มินิมอลคาเฟ่ น่ารักพาสเทล" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">หมวดหมู่สไตล์</label>
            <select id="portCategory" class="form-input" required>
              <option value="ป้ายไวนิล">ป้ายไวนิล</option>
              <option value="ป้ายเมนู">ป้ายเมนู</option>
              <option value="สติกเกอร์">สติกเกอร์</option>
              <option value="งานฟอนต์">งานฟอนต์</option>
              <option value="กราฟิก & โลโก้">กราฟิก & โลโก้</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">ราคาเริ่มต้น (บาท)</label>
            <input type="number" id="portPrice" class="form-input" placeholder="เช่น 250">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">คำอธิบายสไตล์</label>
          <textarea id="portDesc" class="form-input" rows="2" placeholder="อธิบายจุดเด่นของสไตล์นี้..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">ลิงก์รูปภาพในอัลบั้ม (ใส่ 1 ลิงก์ต่อ 1 บรรทัด - ใส่ได้ไม่จำกัด)</label>
          <textarea id="portImages" class="form-input" rows="5" placeholder="https://images.unsplash.com/...&#10;https://images.unsplash.com/..."></textarea>
          <small style="color: var(--text-muted); font-size: 0.82rem;">*บรรทัดแรกจะถูกใช้เป็นรูปภาพหน้าปกของสไตล์นี้</small>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกผลงาน</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script>
    const modal = document.getElementById('portModal');
    const closeBtn = document.getElementById('closePortModal');
    closeBtn.addEventListener('click', closeModal);

    function closeModal() {
      modal.classList.remove('is-active');
    }

    function openAddModal() {
      document.getElementById('portModalTitle').textContent = 'เพิ่มสไตล์ผลงานใหม่';
      document.getElementById('portEditId').value = '';
      document.getElementById('portTitle').value = '';
      document.getElementById('portCategory').value = 'ป้ายไวนิล';
      document.getElementById('portPrice').value = '';
      document.getElementById('portDesc').value = '';
      document.getElementById('portImages').value = '';
      modal.classList.add('is-active');
    }

    window.openEditModal = function(id) {
      const items = Store.getPortfolio();
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('portModalTitle').textContent = 'แก้ไขสไตล์ผลงาน';
      document.getElementById('portEditId').value = item.id;
      document.getElementById('portTitle').value = item.title || '';
      document.getElementById('portCategory').value = item.style_category || item.category || 'ป้ายไวนิล';
      document.getElementById('portPrice').value = item.price || '';
      document.getElementById('portDesc').value = item.description || '';
      
      const imgs = item.images && item.images.length > 0 ? item.images : [item.image_url];
      document.getElementById('portImages').value = imgs.filter(Boolean).join('\\n');

      modal.classList.add('is-active');
    };

    window.deleteItem = function(id) {
      if (!confirm('ยืนยันลบสไตล์ผลงานนี้หรือไม่คะ?')) return;
      Store.deletePortfolioItem(id);
      renderList();
    };

    document.getElementById('portForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('portEditId').value;
      const imagesArr = document.getElementById('portImages').value
        .split('\\n')
        .map(s => s.trim())
        .filter(Boolean);

      const itemData = {
        title: document.getElementById('portTitle').value.trim(),
        category: document.getElementById('portCategory').value,
        style_category: document.getElementById('portCategory').value,
        price: Number(document.getElementById('portPrice').value) || 0,
        description: document.getElementById('portDesc').value.trim(),
        image_url: imagesArr[0] || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600',
        images: imagesArr.length > 0 ? imagesArr : ['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600']
      };

      if (editId) {
        itemData.id = editId;
      }

      Store.savePortfolioItem(itemData);
      closeModal();
      renderList();
    });

    function renderList() {
      const items = Store.getPortfolio();
      document.getElementById('portfolioCount').textContent = items.length + ' สไตล์';
      const container = document.getElementById('portfolioAdminList');

      if (items.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 2rem;">ยังไม่มีผลงานในระบบ</p>';
        return;
      }

      container.innerHTML = items.map(item => {
        const photos = item.images && item.images.length > 0 ? item.images : [item.image_url];
        return '<div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-secondary);">' +
          '<div style="display: flex; align-items: center; gap: 1rem;">' +
            '<img src="' + photos[0] + '" alt="cover" style="width: 70px; height: 70px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border-light);">' +
            '<div>' +
              '<div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">' +
                '<span class="badge badge--pink">' + (item.style_category || item.category) + '</span>' +
                '<strong style="color: var(--text-main); font-size: 1rem;">' + item.title + '</strong>' +
              '</div>' +
              '<p style="color: var(--text-muted); font-size: 0.85rem; margin: 0 0 0.25rem;">' + (item.description || '') + '</p>' +
              '<span style="font-size: 0.8rem; color: var(--pink-primary); font-weight: 600;">' +
                (item.price ? 'เริ่มต้น ฿' + item.price : 'ไม่ระบุราคา') + ' • ' + photos.length + ' รูปในอัลบั้ม' +
              '</span>' +
            '</div>' +
          '</div>' +
          '<div style="display: flex; gap: 0.5rem; flex-shrink: 0;">' +
            '<button type="button" class="btn btn-outline btn-sm" onclick="openEditModal(\'' + item.id + '\')">แก้ไข</button>' +
            '<button type="button" class="btn btn-outline btn-sm" style="color: var(--status-error-text); border-color: var(--status-error-border);" onclick="deleteItem(\'' + item.id + '\')">ลบ</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderList();
    });
  </script>
</body>
</html>
