<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการกลุ่ม LINE 👥 | BNC Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=2.2">
  <link rel="stylesheet" href="../css/components.css?v=2.2">
  <link rel="stylesheet" href="../css/admin.css?v=2.2">
  <style>
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.is-active { display: flex; }
    .modal-box {
      background: var(--white);
      border-radius: 1.5rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      position: relative;
    }
  </style>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="sidebar-brand-title">
          <span>🎨</span>
          <span>BNC Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <span class="sidebar-icon">📊</span>
          <span>แดชบอร์ด</span>
        </a>
        <a href="orders.html" class="sidebar-link">
          <span class="sidebar-icon">📦</span>
          <span>คำสั่งซื้อ</span>
        </a>
        <a href="slips.html" class="sidebar-link">
          <span class="sidebar-icon">🧳</span>
          <span>ตรวจสอบสลิป</span>
        </a>
        <a href="groups.html" class="sidebar-link active">
          <span class="sidebar-icon">👥</span>
          <span>จัดการกลุ่ม LINE</span>
        </a>
        <a href="products.html" class="sidebar-link">
          <span class="sidebar-icon">🛍️</span>
          <span>จัดการสินค้า</span>
        </a>
        <a href="fonts.html" class="sidebar-link">
          <span class="sidebar-icon">🔤</span>
          <span>จัดการฟอนต์</span>
        </a>
        <a href="points.html" class="sidebar-link">
          <span class="sidebar-icon">⭐</span>
          <span>ระบบคะแนน</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          <span class="sidebar-icon">❤️</span>
          <span>รีวิวลูกค้า</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          <span class="sidebar-icon">⚙️</span>
          <span>ตั้งค่าร้าน</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-outline btn-sm btn-full">🏠 ไปหน้าร้านค้า</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <h1 style="font-family: 'Prompt', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--text-main);">
            จัดการกลุ่ม LINE & ดึงลูกค้าเข้ากลุ่ม 👥
          </h1>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openAddGroupModal()">➕ เพิ่มกลุ่มใหม่</button>
      </header>

      <div style="padding: 2rem 1.75rem;">
        <!-- Tabs -->
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
          <button class="btn btn-primary btn-sm" id="tabPendingBtn" onclick="switchTab('pending')">🕐 รอดึงเข้ากลุ่ม</button>
          <button class="btn btn-outline btn-sm" id="tabGroupsBtn" onclick="switchTab('groups')">📑 รายการกลุ่มทั้งหมด</button>
        </div>

        <!-- Section 1: Pending Queue -->
        <div id="pendingTabContent">
          <div id="pendingQueueList">
            <!-- Render dynamically -->
          </div>
        </div>

        <!-- Section 2: Groups List -->
        <div id="groupsTabContent" style="display: none;">
          <div id="adminGroupsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Render dynamically -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Group Modal -->
  <div class="modal-overlay" id="groupModal">
    <div class="modal-box">
      <button onclick="closeGroupModal()" style="position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 1.5rem; cursor: pointer;">×</button>
      <h3 style="font-family: 'Mitr', sans-serif; margin-bottom: 1.25rem;" id="modalTitle">เพิ่มกลุ่ม LINE ใหม่</h3>

      <form id="groupForm">
        <input type="hidden" id="grpId">
        <div class="form-group">
          <label class="form-label">ชื่อกลุ่ม</label>
          <input type="text" id="grpName" class="form-input" placeholder="เช่น กลุ่ม VIP ป้ายกราฟิก 2026" required>
        </div>
        <div class="form-group">
          <label class="form-label">ราคา (บาท)</label>
          <input type="number" id="grpPrice" class="form-input" placeholder="390" required>
        </div>
        <div class="form-group">
          <label class="form-label">รายละเอียดกลุ่ม</label>
          <textarea id="grpDesc" class="form-textarea" rows="2" placeholder="อธิบายจุดเด่นของกลุ่มนี้"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">สิ่งที่จะได้รับ (บรรทัดละ 1 ข้อ)</label>
          <textarea id="grpBenefits" class="form-textarea" rows="3" placeholder="เข้ากลุ่มถาวร&#10;ไฟล์อัปเดตตลอดชีพ&#10;ฟอนต์ฟรี"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">ลิงก์ Google Drive ดูตัวอย่าง</label>
          <input type="url" id="grpPreviewUrl" class="form-input" placeholder="https://drive.google.com/drive/folders/...">
        </div>
        <div class="form-group">
          <label class="form-label">รูปภาพ Cover (URL)</label>
          <input type="url" id="grpCover" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" onclick="closeGroupModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกข้อมูล ➔</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script>
    function switchTab(tab) {
      if (tab === 'pending') {
        document.getElementById('pendingTabContent').style.display = 'block';
        document.getElementById('groupsTabContent').style.display = 'none';
        document.getElementById('tabPendingBtn').className = 'btn btn-primary btn-sm';
        document.getElementById('tabGroupsBtn').className = 'btn btn-outline btn-sm';
      } else {
        document.getElementById('pendingTabContent').style.display = 'none';
        document.getElementById('groupsTabContent').style.display = 'block';
        document.getElementById('tabPendingBtn').className = 'btn btn-outline btn-sm';
        document.getElementById('tabGroupsBtn').className = 'btn btn-primary btn-sm';
      }
    }

    function renderPendingQueue() {
      const list = Store.getGroupAccessList();
      const container = document.getElementById('pendingQueueList');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-state__emoji">👥</span>
            <h3 class="empty-state__title">ไม่มีลูกค้ารอดึงเข้ากลุ่ม</h3>
            <p class="empty-state__text">ทุกคำสั่งซื้อเข้ากลุ่มได้รับการดำเนินการครบถ้วนแล้วค่ะ 🎉</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="card card--flat" style="padding: 1.5rem; margin-bottom: 1rem; border: 1px solid var(--border-light); border-left: 4px solid ${item.status === 'COMPLETED' ? '#10B981' : item.status === 'FAILED' ? '#EF4444' : '#F59E0B'}; border-radius: var(--radius-md); background: var(--bg-primary);">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.75rem;">
            <div>
              <span class="badge" style="background: ${item.status === 'COMPLETED' ? '#F0FDF4' : item.status === 'FAILED' ? '#FFF1F2' : '#FFFBEB'}; color: ${item.status === 'COMPLETED' ? '#166534' : item.status === 'FAILED' ? '#9F1239' : '#92400E'}; font-weight: 600;">
                ${item.status === 'COMPLETED' ? '✅ ดึงเข้ากลุ่มเรียบร้อย' : item.status === 'FAILED' ? '❌ ไม่สามารถดึงเข้ากลุ่มได้' : '🕐 รอดึงเข้ากลุ่ม'}
              </span>
              <h3 style="font-family: 'Prompt', sans-serif; font-size: 1.15rem; font-weight: 600; margin: 0.5rem 0 0.25rem; color: var(--text-main);">
                กลุ่ม: ${item.group_name}
              </h3>
              <p style="font-size: 0.92rem; color: var(--text-muted); margin: 0;">
                ลูกค้า: <strong>${item.customer_name}</strong> | LINE ID: <strong style="color: var(--pink-deep); font-size: 1.05rem; background: var(--bg-surface); padding: 0.2rem 0.6rem; border-radius: var(--radius-sm);">${item.line_id || '-'}</strong>
              </p>
            </div>

            <div style="display: flex; gap: 0.5rem; align-items: center;">
              ${item.status === 'PENDING' ? `
                <button class="btn btn-success btn-sm" onclick="completeGroupAccess('${item.id}')">
                  ✅ ดึงเข้ากลุ่มเรียบร้อย
                </button>
                <button class="btn btn-danger btn-sm" onclick="failGroupAccess('${item.id}')">
                  ❌ ไม่สำเร็จ
                </button>
              ` : `
                <button class="btn btn-outline btn-sm" onclick="resetGroupAccess('${item.id}')">
                  🔄 รีเซ็ตสถานะ
                </button>
              `}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderGroupsList() {
      const groups = Store.getAllGroups();
      const container = document.getElementById('adminGroupsGrid');

      container.innerHTML = groups.map(g => `
        <div class="card card--flat" style="border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-primary);">
          <img src="${g.cover_image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" style="width: 100%; height: 180px; object-fit: cover;">
          <div class="card__body" style="padding: 1.35rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
              <h3 style="font-family: 'Prompt', sans-serif; font-size: 1.15rem; font-weight: 600; margin: 0; color: var(--text-main);">${g.name}</h3>
              <span style="font-family: 'Prompt', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--pink-deep);">฿${g.price}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin: 0.5rem 0 1.25rem;">${g.description}</p>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-outline btn-sm" onclick="openEditGroupModal('${g.id}')">✏️ แก้ไข</button>
              <button class="btn btn-danger btn-sm" onclick="deleteGroup('${g.id}')">🗑️ ลบ</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.completeGroupAccess = function(id) {
      Store.completeGroupAccess(id);
      renderPendingQueue();
    };

    window.failGroupAccess = function(id) {
      const note = prompt('ระบุเหตุผลที่ไม่สามารถดึงได้ (เช่น ไม่พบ LINE ID):', 'ไม่พบ LINE ID หรือไม่ได้เปิดรับเพื่อน');
      if (note) {
        Store.failGroupAccess(id, note);
        renderPendingQueue();
      }
    };

    window.resetGroupAccess = function(id) {
      const data = Store.get();
      const ga = data.group_access.find(g => g.id === id);
      if (ga) {
        ga.status = 'PENDING';
        Store.set(data);
        renderPendingQueue();
      }
    };

    // Modal
    const modal = document.getElementById('groupModal');
    window.openAddGroupModal = function() {
      document.getElementById('modalTitle').textContent = 'เพิ่มกลุ่ม LINE ใหม่';
      document.getElementById('groupForm').reset();
      document.getElementById('grpId').value = '';
      modal.classList.add('is-active');
    };

    window.openEditGroupModal = function(id) {
      const groups = Store.getAllGroups();
      const g = groups.find(x => x.id === id);
      if (!g) return;
      document.getElementById('modalTitle').textContent = 'แก้ไขกลุ่ม LINE';
      document.getElementById('grpId').value = g.id;
      document.getElementById('grpName').value = g.name;
      document.getElementById('grpPrice').value = g.price;
      document.getElementById('grpDesc').value = g.description || '';
      document.getElementById('grpBenefits').value = g.benefits || '';
      document.getElementById('grpPreviewUrl').value = g.preview_drive_url || '';
      document.getElementById('grpCover').value = g.cover_image || '';
      modal.classList.add('is-active');
    };

    window.closeGroupModal = function() {
      modal.classList.remove('is-active');
    };

    window.deleteGroup = function(id) {
      if (confirm('ต้องการลบกลุ่มนี้หรือไม่?')) {
        Store.deleteGroup(id);
        renderGroupsList();
      }
    };

    document.getElementById('groupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('grpId').value;
      const gData = {
        name: document.getElementById('grpName').value.trim(),
        price: Number(document.getElementById('grpPrice').value),
        description: document.getElementById('grpDesc').value.trim(),
        benefits: document.getElementById('grpBenefits').value.trim(),
        preview_drive_url: document.getElementById('grpPreviewUrl').value.trim(),
        cover_image: document.getElementById('grpCover').value.trim(),
        status: 'ACTIVE'
      };
      if (id) gData.id = id;
      Store.saveGroup(gData);
      closeGroupModal();
      renderGroupsList();
      alert('บันทึกกลุ่มเรียบร้อยแล้วค่ะ 🌸');
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderPendingQueue();
      renderGroupsList();
    });
  </script>
</body>
</html>
