<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการสินค้าดิจิทัล 🛍️ | BNC Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .modal-overlay.is-active { display: flex; }
    .modal-box {
      background: var(--white); border-radius: 1.5rem; width: 100%; max-width: 540px;
      max-height: 90vh; overflow-y: auto; padding: 1.75rem; position: relative;
    }
  </style>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-brand" style="padding: 1.5rem; display: flex; align-items: center; gap: 0.5rem; font-family: 'Mitr', sans-serif; font-size: 1.2rem; color: var(--pink-500); border-bottom: 1px solid var(--pink-100);">
        <span>🎨</span>
        <span>BNC Admin</span>
      </div>
      <nav class="sidebar-nav" style="padding: 1rem 0;">
        <a href="index.html" class="sidebar-link">📊 แดชบอร์ด</a>
        <a href="orders.html" class="sidebar-link">📦 คำสั่งซื้อ</a>
        <a href="slips.html" class="sidebar-link">🧳 ตรวจสอบสลิป</a>
        <a href="groups.html" class="sidebar-link">👥 จัดการกลุ่ม LINE</a>
        <a href="products.html" class="sidebar-link active">🛍️ จัดการสินค้า</a>
        <a href="fonts.html" class="sidebar-link">🔤 จัดการฟอนต์</a>
        <a href="points.html" class="sidebar-link">⭐ ระบบคะแนน</a>
        <a href="reviews.html" class="sidebar-link">❤️ รีวิวลูกค้า</a>
        <a href="settings.html" class="sidebar-link">⚙️ ตั้งค่าร้าน</a>
      </nav>
      <div style="padding: 1.5rem; margin-top: auto; border-top: 1px solid var(--gray-200);">
        <a href="../index.html" class="btn btn-outline btn-sm btn-full">🏠 ไปหน้าร้านค้า</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar" style="background: var(--white); border-bottom: 1px solid var(--pink-100); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="font-family: 'Mitr', sans-serif; font-size: 1.3rem; margin: 0; color: var(--gray-900);">
          จัดการสินค้าสำเร็จรูป (Digital Products) 🛍️
        </h1>
        <button class="btn btn-primary btn-sm" onclick="openAddProdModal()">➕ เพิ่มสินค้าใหม่</button>
      </header>

      <div style="padding: 1.5rem;">
        <div id="adminProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Render dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="pAdminModal">
    <div class="modal-box">
      <button onclick="closePAdminModal()" style="position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 1.5rem; cursor: pointer;">×</button>
      <h3 style="font-family: 'Mitr', sans-serif; margin-bottom: 1.25rem;" id="pAdminTitle">เพิ่มสินค้าใหม่</h3>

      <form id="pAdminForm">
        <input type="hidden" id="pAdminId">
        <div class="form-group">
          <label class="form-label">ชื่อสินค้า</label>
          <input type="text" id="pName" class="form-input" placeholder="เช่น ชุดเทมเพลตป้ายเมนูเครื่องดื่ม" required>
        </div>
        <div class="form-group">
          <label class="form-label">หมวดหมู่</label>
          <select id="pCat" class="form-input">
            <option value="Template">Template (เทมเพลต)</option>
            <option value="Cartoon">Cartoon (การ์ตูนไดคัท)</option>
            <option value="Elements">Elements (องค์ประกอบแต่งป้าย)</option>
            <option value="Graphic">Graphic (งานกราฟิก)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ราคา (บาท)</label>
          <input type="number" id="pPrice" class="form-input" placeholder="159" required>
        </div>
        <div class="form-group">
          <label class="form-label">รายละเอียดสินค้า</label>
          <textarea id="pDesc" class="form-textarea" rows="2" placeholder="อธิบายจุดเด่นของไฟล์"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">สิ่งที่จะได้รับ (บรรทัดละ 1 ข้อ)</label>
          <textarea id="pWhat" class="form-textarea" rows="3" placeholder="ไฟล์ PSD แก้ไขได้&#10;ลิงก์เทมเพลต Canva&#10;ฟอนต์ฟรีที่ใช้ในงาน"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">รูปภาพสินค้า (URL)</label>
          <input type="url" id="pImg" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group" style="background: var(--pink-50); padding: 1rem; border-radius: 1rem; border: 1px solid var(--pink-200);">
          <label class="form-label" style="color: var(--pink-600); font-weight: 600;">วิธีจัดส่งสินค้า:</label>
          <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.35rem; cursor: pointer;">
              <input type="radio" name="p_delivery" value="GOOGLE_DRIVE" checked onchange="togglePFolderBox()">
              <span>Google Drive (ดึงสิทธิ์ออโต้)</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.35rem; cursor: pointer;">
              <input type="radio" name="p_delivery" value="MANUAL" onchange="togglePFolderBox()">
              <span>จัดส่งเอง (Manual)</span>
            </label>
          </div>
        </div>

        <div class="form-group" id="pFolderBox">
          <label class="form-label">Google Drive Folder ID หรือ File ID</label>
          <input type="text" id="pDriveId" class="form-input" placeholder="1aBcDeFgHiJkLmNoPqRsTuVwXyZ">
        </div>

        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-outline" onclick="closePAdminModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกสินค้า ➔</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script>
    function togglePFolderBox() {
      const isDrive = document.querySelector('input[name="p_delivery"]:checked').value === 'GOOGLE_DRIVE';
      document.getElementById('pFolderBox').style.display = isDrive ? 'block' : 'none';
    }

    function renderProducts() {
      const prods = Store.getAllProducts();
      const container = document.getElementById('adminProductsGrid');

      container.innerHTML = prods.map(p => `
        <div class="card card--flat">
          <img src="${p.image || 'https://images.unsplash.com/photo-1541643600914-78b084683601?w=600'}" style="width: 100%; height: 180px; object-fit: cover;">
          <div class="card__body">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <span class="badge badge--pink">${p.category}</span>
              <span class="price-tag price-tag--sm">฿${p.price}</span>
            </div>
            <h3 style="font-family: 'Mitr', sans-serif; font-size: 1.15rem; margin: 0.35rem 0;">${p.name}</h3>
            <span style="font-size: 0.8rem; font-weight: 500; color: ${p.delivery_type === 'GOOGLE_DRIVE' ? 'var(--success)' : 'var(--info)'}; display: block; margin-bottom: 0.75rem;">
              ${p.delivery_type === 'GOOGLE_DRIVE' ? '⚡ ส่ง Google Drive' : '👩‍💼 ส่งเอง (Manual)'}
            </span>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-outline btn-sm" onclick="openEditProdModal('${p.id}')">✏️ แก้ไข</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProd('${p.id}')">🗑️ ลบ</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    const modal = document.getElementById('pAdminModal');
    window.openAddProdModal = function() {
      document.getElementById('pAdminTitle').textContent = 'เพิ่มสินค้าใหม่';
      document.getElementById('pAdminForm').reset();
      document.getElementById('pAdminId').value = '';
      togglePFolderBox();
      modal.classList.add('is-active');
    };

    window.openEditProdModal = function(id) {
      const p = Store.getAllProducts().find(x => x.id === id);
      if (!p) return;
      document.getElementById('pAdminTitle').textContent = 'แก้ไขสินค้า';
      document.getElementById('pAdminId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pCat').value = p.category;
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pDesc').value = p.description || '';
      document.getElementById('pWhat').value = p.what_you_get || '';
      document.getElementById('pImg').value = p.image || '';
      document.getElementById('pDriveId').value = p.drive_folder_id || '';

      const radios = document.querySelectorAll('input[name="p_delivery"]');
      radios.forEach(r => r.checked = (r.value === p.delivery_type));
      togglePFolderBox();
      modal.classList.add('is-active');
    };

    window.closePAdminModal = function() { modal.classList.remove('is-active'); };

    window.deleteProd = function(id) {
      if (confirm('ต้องการลบสินค้านี้หรือไม่?')) {
        Store.deleteProduct(id);
        renderProducts();
      }
    };

    document.getElementById('pAdminForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('pAdminId').value;
      const delivery = document.querySelector('input[name="p_delivery"]:checked').value;
      const data = {
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCat').value,
        price: Number(document.getElementById('pPrice').value),
        description: document.getElementById('pDesc').value.trim(),
        what_you_get: document.getElementById('pWhat').value.trim(),
        image: document.getElementById('pImg').value.trim(),
        delivery_type: delivery,
        drive_folder_id: delivery === 'GOOGLE_DRIVE' ? document.getElementById('pDriveId').value.trim() : '',
        status: 'ACTIVE'
      };
      if (id) data.id = id;
      Store.saveProduct(data);
      closePAdminModal();
      renderProducts();
      alert('บันทึกสินค้าเรียบร้อยแล้วค่ะ 🌸');
    });

    document.addEventListener('DOMContentLoaded', renderProducts);
  </script>
</body>
</html>
