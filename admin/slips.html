<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสลิปการโอนเงิน  | BNC Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css?v=2.2">
  <link rel="stylesheet" href="../css/components.css?v=2.2">
  <link rel="stylesheet" href="../css/admin.css?v=2.2">
  <style>
    .slip-card-admin {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-subtle);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .slip-img-holder {
      background: var(--bg-secondary);
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border-bottom: 1px solid var(--border-light);
    }
    .slip-img-holder img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="sidebar-brand-title">
          <span></span>
          <span>BNC Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          
          <span>แดชบอร์ด</span>
        </a>
        <a href="orders.html" class="sidebar-link">
          
          <span>คำสั่งซื้อ</span>
        </a>
        <a href="slips.html" class="sidebar-link active">
          
          <span>ตรวจสอบสลิป</span>
        </a>
        <a href="groups.html" class="sidebar-link">
          
          <span>จัดการกลุ่ม LINE</span>
        </a>
        <a href="products.html" class="sidebar-link">
          
          <span>จัดการสินค้า</span>
        </a>
        <a href="fonts.html" class="sidebar-link">
          
          <span>จัดการฟอนต์</span>
        </a>
        <a href="portfolio.html" class="sidebar-link">
          <span>จัดการผลงาน</span>
        </a>
        <a href="points.html" class="sidebar-link">
          
          <span>ระบบคะแนน</span>
        </a>
        <a href="reviews.html" class="sidebar-link">
          
          <span>รีวิวลูกค้า</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          
          <span>ตั้งค่าร้าน</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-outline btn-sm btn-full"> ไปหน้าร้านค้า</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <h1 style="font-family: 'Prompt', sans-serif; font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--text-main);">
            ตรวจสอบสลิปการโอนเงิน (Slip Verification) 
          </h1>
        </div>
      </header>

      <div style="padding: 2rem 1.75rem;">
        <!-- Filters -->
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.75rem; flex-wrap: wrap;">
          <button class="btn btn-primary btn-sm" onclick="filterSlips('VERIFYING', this)">รอตรวจสอบ</button>
          <button class="btn btn-outline btn-sm" onclick="filterSlips('ALL', this)">ทั้งหมด</button>
          <button class="btn btn-outline btn-sm" onclick="filterSlips('PAID', this)">อนุมัติแล้ว</button>
          <button class="btn btn-outline btn-sm" onclick="filterSlips('REJECTED', this)">ปฏิเสธ</button>
        </div>

        <!-- Slips Grid -->
        <div id="slipsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Render dynamically -->
        </div>
      </div>
    </main>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script>
    let currentFilter = 'VERIFYING';

    function filterSlips(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.admin-main button').forEach(b => b.className = 'btn btn-outline btn-sm');
      if (btn) btn.className = 'btn btn-primary btn-sm';
      renderSlips();
    }

    function renderSlips() {
      const payments = Store.getPayments();
      const orders = Store.getOrders();
      const container = document.getElementById('slipsGrid');

      let list = payments;
      if (currentFilter !== 'ALL') {
        list = payments.filter(p => p.verification_status === currentFilter);
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <span class="empty-state__emoji"></span>
            <h3 class="empty-state__title">ไม่มีรายการสลิปในสถานะนี้</h3>
            <p class="empty-state__text">แอดมินจัดการสลิปเรียบร้อยหมดแล้วค่ะ</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(pay => {
        const ord = orders.find(o => o.id === pay.order_id);
        const orderNum = ord ? ord.order_number : pay.order_id;
        const itemName = ord ? ord.item_name : 'ไม่ระบุสินค้า';
        const custName = ord ? ord.customer_name : 'ลูกค้า';
        const lineId = ord ? ord.line_id : '-';

        return `
          <div class="slip-card-admin">
            <div class="slip-img-holder" onclick="window.open('${pay.slip_image_url || 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c'}')">
              <img src="${pay.slip_image_url || 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c'}" alt="Slip Image">
            </div>
            <div style="padding: 1.25rem; flex: 1; display: flex; flex-direction: column;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                <span class="badge" style="background: var(--bg-surface); color: var(--pink-deep); font-weight: 600;">#${orderNum}</span>
                <span style="font-family: 'Prompt', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--pink-deep);">฿${pay.amount}</span>
              </div>
              <h4 style="font-family: 'Prompt', sans-serif; margin: 0.35rem 0; font-size: 1rem; color: var(--text-main);">${itemName}</h4>
              <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 0.75rem;">
                 ${custName} | LINE: <code style="color: var(--pink-deep); background: var(--bg-surface); padding: 2px 6px; border-radius: 4px;">${lineId}</code>
              </p>

              <!-- QR Analysis Box -->
              <div style="background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 0.65rem 0.85rem; font-size: 0.82rem; margin-bottom: 1.25rem;">
                <strong style="color: var(--text-main);"> ข้อมูล QR สลิป:</strong><br>
                Ref: <code style="font-size: 0.8rem;">${pay.qr_trans_ref || 'MANUAL-CHECK'}</code>
              </div>

              <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
                ${pay.verification_status === 'VERIFYING' ? `
                  <button class="btn btn-success btn-sm" onclick="approveSlip('${pay.id}')"> ยืนยันยอด</button>
                  <button class="btn btn-danger btn-sm" onclick="rejectSlip('${pay.id}')"> ปฏิเสธ</button>
                ` : `
                  <div style="grid-column: 1/-1; text-align: center; font-weight: 600; font-size: 0.85rem; padding: 0.35rem 0; border-radius: var(--radius-sm); background: ${pay.verification_status === 'PAID' ? '#F0FDF4' : '#FFF1F2'}; color: ${pay.verification_status === 'PAID' ? '#166534' : '#9F1239'};">
                    ${pay.verification_status === 'PAID' ? ' ยืนยันแล้ว' : ' ปฏิเสธสลิป'}
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.approveSlip = function(paymentId) {
      if (confirm('ยืนยันการตรวจสอบสลิปนี้? ระบบจะอัปเดตสถานะออเดอร์และมอบแต้มให้ลูกค้าโดยอัตโนมัติ')) {
        Store.approvePayment(paymentId);
        renderSlips();
      }
    };

    window.rejectSlip = function(paymentId) {
      const reason = prompt('ระบุเหตุผลที่ปฏิเสธสลิป:', 'สลิปไม่ถูกต้อง หรือยอดเงินไม่ตรง');
      if (reason) {
        Store.rejectPayment(paymentId, reason);
        renderSlips();
      }
    };

    document.addEventListener('DOMContentLoaded', renderSlips);
  </script>
</body>
</html>
