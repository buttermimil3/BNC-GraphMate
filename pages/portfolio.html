<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลงานในร้าน 🎨 | BNC GraphMate</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar__container">
      <a href="../index.html" class="navbar__brand">
        <span class="navbar__logo">🎨</span>
        <span class="navbar__title">BNC GraphMate</span>
      </a>
      <button class="navbar__hamburger" id="navToggle" aria-label="เมนู">
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
      </button>
      <nav class="navbar__nav" id="navMenu">
        <a href="../index.html" class="navbar__link">หน้าแรก</a>
        <a href="portfolio.html" class="navbar__link active">ผลงาน</a>
        <a href="pricing.html" class="navbar__link">ราคา/บริการ</a>
        <a href="groups.html" class="navbar__link">เข้ากลุ่ม LINE 👥</a>
        <a href="products.html" class="navbar__link">สินค้าสำเร็จ 🛍️</a>
        <a href="fonts.html" class="navbar__link">ฟอนต์ 🔤</a>
        <a href="points.html" class="navbar__link">สะสมแต้ม ⭐</a>
        <a href="reviews.html" class="navbar__link">รีวิว ❤️</a>
        <a href="orders.html" class="navbar__link">สถานะออเดอร์ 📦</a>
        <a href="contact.html" class="navbar__link">ติดต่อ/LINE 💬</a>
      </nav>
    </div>
  </header>

  <main>
    <section style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-light); padding: 3rem 1.5rem; text-align: center;">
      <div class="container" style="max-width: 700px;">
        <span class="badge" style="background: var(--bg-surface); color: var(--pink-deep); margin-bottom: 0.75rem; font-weight: 600;">PORTFOLIO SHOWCASE</span>
        <h1 style="font-family: 'Prompt', sans-serif; font-size: 2.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem;">
          ผลงานในสตูดิโอ 🎨
        </h1>
        <p style="color: var(--text-muted); font-size: 1.05rem; line-height: 1.6;">
          ชมตัวอย่างงานป้ายไวนิล ป้ายเมนูร้าน สติกเกอร์ไดคัท และงานฟอนต์จริงจากลูกค้าที่ไว้วางใจ BNC GraphMate
        </p>
      </div>
    </section>

    <section style="padding: 3rem 1.5rem;">
      <div class="container">
        <div id="portfolioGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Render dynamically -->
        </div>
      </div>
    </section>
  </main>

  <script src="../js/store.js"></script>
  <script>
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    if (navToggle && navMenu) navToggle.addEventListener('click', () => navMenu.classList.toggle('is-open'));

    document.addEventListener('DOMContentLoaded', () => {
      const items = Store.getPortfolio();
      const container = document.getElementById('portfolioGrid');
      if (items.length > 0) {
        container.innerHTML = items.map(item => `
          <div class="card card--flat" style="overflow: hidden; border: 1px solid var(--border-light); border-radius: var(--radius-lg); background: var(--bg-primary); transition: transform 0.2s, box-shadow 0.2s;">
            <div style="width: 100%; height: 260px; overflow: hidden; background: var(--bg-secondary);">
              <img src="${item.image_url}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
            </div>
            <div class="card__body" style="padding: 1.35rem;">
              <span class="badge" style="background: var(--bg-surface); color: var(--pink-deep); font-size: 0.75rem; font-weight: 600; margin-bottom: 0.5rem;">${item.category}</span>
              <h3 style="font-family: 'Prompt', sans-serif; font-size: 1.15rem; font-weight: 600; color: var(--text-main); margin: 0.35rem 0;">${item.title}</h3>
              <p style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin: 0;">${item.description}</p>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>กำลังอัปเดตแฟ้มผลงานเร็วๆ นี้ค่ะ 🌸</p></div>';
      }
    });
  </script>
</body>
</html>
