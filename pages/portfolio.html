<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลงานในร้าน 🎨 | BNC GraphMate</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar__container">
      <a href="../index.html" class="navbar__brand">
        <span class="navbar__logo">🎨</span>
        <span class="navbar__title">BNC GraphMate</span>
      </a>
      <button class="navbar__hamburger" id="navToggle" aria-label="เมนู">
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
        <span class="navbar__hamburger-bar"></span>
      </button>
      <nav class="navbar__nav" id="navMenu">
        <a href="../index.html" class="navbar__link">หน้าแรก</a>
        <a href="portfolio.html" class="navbar__link active">ผลงาน</a>
        <a href="pricing.html" class="navbar__link">ราคา/บริการ</a>
        <a href="groups.html" class="navbar__link">เข้ากลุ่ม LINE 👥</a>
        <a href="products.html" class="navbar__link">สินค้าสำเร็จ 🛍️</a>
        <a href="fonts.html" class="navbar__link">ฟอนต์ 🔤</a>
        <a href="points.html" class="navbar__link">สะสมแต้ม ⭐</a>
        <a href="reviews.html" class="navbar__link">รีวิว ❤️</a>
        <a href="orders.html" class="navbar__link">สถานะออเดอร์ 📦</a>
        <a href="contact.html" class="navbar__link">ติดต่อ/LINE 💬</a>
      </nav>
    </div>
  </header>

  <main>
    <section style="background: var(--pink-50); border-bottom: 2px solid var(--pink-100); padding: 2.5rem 1rem; text-align: center;">
      <div class="container">
        <span class="badge badge--pink" style="margin-bottom: 0.5rem;">Our Showcase</span>
        <h1 style="font-family: 'Mitr', sans-serif; font-size: 2.2rem; color: var(--gray-900); margin-bottom: 0.5rem;">
          ผลงานออกแบบในร้าน 🎨
        </h1>
        <p style="color: var(--gray-600); max-width: 550px; margin: 0 auto;">
          ตัวอย่างงานป้ายจริง งานสติกเกอร์ งานกราฟิก และการใช้ฟอนต์สไตล์ BNC GraphMate
        </p>
      </div>
    </section>

    <section style="padding: 2.5rem 1rem;">
      <div class="container">
        <div id="portfolioGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Render dynamically -->
        </div>
      </div>
    </section>
  </main>

  <script src="../js/store.js"></script>
  <script>
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    if (navToggle && navMenu) navToggle.addEventListener('click', () => navMenu.classList.toggle('is-open'));

    document.addEventListener('DOMContentLoaded', () => {
      const items = Store.getPortfolio();
      const container = document.getElementById('portfolioGrid');
      if (items.length > 0) {
        container.innerHTML = items.map(item => `
          <div class="card card--flat" style="overflow: hidden;">
            <img src="${item.image_url}" alt="${item.title}" style="width: 100%; height: 240px; object-fit: cover;">
            <div class="card__body">
              <span class="badge badge--pink" style="margin-bottom: 0.35rem;">${item.category}</span>
              <h3 style="font-family: 'Mitr', sans-serif; font-size: 1.15rem; color: var(--gray-900); margin: 0.25rem 0;">${item.title}</h3>
              <p style="color: var(--gray-600); font-size: 0.9rem;">${item.description}</p>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
