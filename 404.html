<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 ไม่พบหน้าเว็บ | BNC GraphMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .error-page-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-code {
      font-family: 'Prompt', sans-serif;
      font-size: 5rem;
      font-weight: 700;
      color: var(--pink-primary);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: 'Prompt', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container navbar__container">
      <a href="/" class="navbar__brand">
        <span class="navbar__logo-text">BNC GraphMate</span>

      <a href="/" class="btn btn-primary btn-sm">กลับหน้าแรก</a>
    </div>
  </header>

  <main class="container">
    <div class="error-page-container">
      <div class="error-code">404</div>
      <h1 class="error-title">ไม่พบหน้าที่คุณต้องการ</h1>
      <p class="error-desc">
        ลิงก์ที่คุณเปิดอาจพิมพ์ผิด หรือหน้านี้อาจถูกย้ายตำแหน่งแล้วค่ะ คุณสามารถกดปุ่มด้านล่างเพื่อกลับไปยังหน้าหลักของร้านได้เลยนะคะ
      </p>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;">
        <a href="/" class="btn btn-primary">กลับสู่หน้าแรก</a>
        <a href="/pages/contact.html" class="btn btn-outline">ติดต่อร้าน</a>
      </div>
    </div>
  </main>
